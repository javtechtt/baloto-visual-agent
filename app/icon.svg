<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon marquee gradient: cyan -> magenta -> gold -->
    <linearGradient id="neon" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#ff2d95"/>
      <stop offset="1" stop-color="#ffd86b"/>
    </linearGradient>
    <!-- Deep violet casino tile -->
    <radialGradient id="tile" cx="0.5" cy="0.28" r="0.9">
      <stop stop-color="#1c0e38"/>
      <stop offset="1" stop-color="#070310"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Tile + neon edge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#tile)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="url(#neon)" stroke-width="2.5"/>

  <!-- Glow halo behind the monogram -->
  <g filter="url(#glow)" opacity="0.7">
    <text x="31" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="44" fill="url(#neon)">B</text>
  </g>
  <!-- Crisp monogram -->
  <text x="31" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="44" fill="url(#neon)">B</text>

  <!-- Marquee bulb (echoes the logo's pulsing dot) -->
  <circle cx="49" cy="15" r="2.8" fill="#ff6ec7"/>
</svg>
